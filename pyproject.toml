[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aivd"
version = "3.30.0"
description = "Autonomous AI Vulnerability Discovery — research platform (mock/authorized targets)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AIVD Research" }]
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "torch>=2.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
aivd = "aivd.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aivd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
